[project]
name = "wellclose"
version = "0.1.0"
description = "Agentic well abandonment & decommissioning data intelligence (Product Brief v1.4)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pgvector>=0.3",
  "pydantic>=2.7", "pydantic-settings>=2.2", "typer>=0.12",
  "httpx>=0.27", "tenacity>=8.3", "pypdfium2>=4.30", "pillow>=10",
  "pytesseract>=0.3.10", "pyyaml>=6", "jinja2>=3.1",
  "openai>=1.30",            # OpenAI-compatible client -> LiteLLM gateway
  "temporalio>=1.6",         # ADR-001
  "strands-agents>=0.1",     # ADR-004
  "mcp>=1.0",                # §8.7 tool server
  "fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9",
  "langfuse>=2.30", "minio>=7.2", "reportlab>=4.0", "pyjwt[crypto]>=2.8",
]
[project.optional-dependencies]
ocr-doctr = ["python-doctr[torch]>=0.8"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]
[project.scripts]
wellclose = "wellclose.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/wellclose"]
[tool.ruff]
line-length = 110
[tool.mypy]
strict = true
ignore_missing_imports = true
