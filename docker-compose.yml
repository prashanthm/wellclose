# Laptop profile (Brief §11, §16.5). Models run NATIVELY via Ollama for Metal access — not in containers.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: wellclose, POSTGRES_PASSWORD: wellclose, POSTGRES_DB: wellclose }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: wellclose, MINIO_ROOT_PASSWORD: wellclose-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=wellclose
      - POSTGRES_PWD=wellclose
      - POSTGRES_SEEDS=postgres
    ports: ["7233:7233"]
    depends_on: [postgres]
  temporal-ui:
    image: temporalio/ui:2.26.2
    environment: [TEMPORAL_ADDRESS=temporal:7233]
    ports: ["8233:8080"]
    depends_on: [temporal]
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/config.yaml", "--port", "4000"]
    volumes: ["./compose/litellm-config.yaml:/config.yaml:ro"]
    ports: ["4000:4000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  langfuse:
    image: langfuse/langfuse:2
    environment:
      - DATABASE_URL=postgresql://wellclose:wellclose@postgres:5432/langfuse
      - NEXTAUTH_SECRET=dev-secret-change-me
      - SALT=dev-salt-change-me
      - NEXTAUTH_URL=http://localhost:3000
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes: { pgdata: {}, miniodata: {} }
