name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e ".[dev]" ruff mypy
      - name: Lint (ruff)
        run: ruff check src tests evals
      - name: Unit tests
        run: pytest tests/ -q
      # mypy strict has pre-existing debt across the codebase (tracked); report-only
      # until clean, then flip continue-on-error off so it gates like ruff/pytest.
      - name: Type check (mypy strict, report-only)
        run: mypy src
        continue-on-error: true
